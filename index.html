<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VoyYo - Administración</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 36px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    .contenedor {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .panel h2 {
      margin-bottom: 20px;
    }

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .estadistica {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .estadistica strong {
      display: block;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .pedido {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .pedido h3 {
      margin-bottom: 12px;
    }

    .pedido p {
      margin: 7px 0;
      color: #444;
    }

    .estado {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      background: #eee;
    }

    .botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .pendiente {
      background: #fff3cd;
    }

    .curso {
      background: #cfe2ff;
    }

    .completado {
      background: #d1e7dd;
    }

    .cancelado {
      background: #f8d7da;
    }

    .btn-pendiente {
      background: #ffc107;
    }

    .btn-curso {
      background: #0d6efd;
      color: white;
    }

    .btn-completado {
      background: #198754;
      color: white;
    }

    .btn-cancelado {
      background: #dc3545;
      color: white;
    }

    .vacio {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .cerrar {
      display: block;
      margin: 25px auto 0;
      background: #111;
      color: white;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

  </style>
</head>

<body>


<header>

  <h1>VOYYO</h1>

  <p>Panel de administración</p>

</header>


<div class="contenedor">


  <div class="estadisticas">

    <div class="estadistica">

      <strong id="total">
        0
      </strong>

      Pedidos totales

    </div>


    <div class="estadistica">

      <strong id="pendientes">
        0
      </strong>

      Pendientes

    </div>


    <div class="estadistica">

      <strong id="curso">
        0
      </strong>

      En curso

    </div>


    <div class="estadistica">

      <strong id="completados">
        0
      </strong>

      Completados

    </div>

  </div>


  <div class="panel">

    <h2>
      📦 Pedidos de VoyYo
    </h2>

    <div id="listaPedidos">

      <div class="vacio">

        Todavía no hay pedidos.

      </div>

    </div>

  </div>


  <button
    class="cerrar"
    onclick="volverInicio()">

    ← Volver a VoyYo

  </button>


</div>


<footer>

  <p>© 2026 VoyYo</p>

  <p>Administración - Cuenca</p>

</footer>


<script>


let pedidos = [];


function mostrarPedidos() {

  let lista =
    document.getElementById("listaPedidos");

  lista.innerHTML = "";


  if (pedidos.length === 0) {

    lista.innerHTML =
      '<div class="vacio">Todavía no hay pedidos.</div>';

    actualizarEstadisticas();

    return;

  }


  pedidos.forEach(function(pedido, indice) {

    let claseEstado = "";

    if (pedido.estado === "Pendiente") {
      claseEstado = "pendiente";
    }

    else if (pedido.estado === "En curso") {
      claseEstado = "curso";
    }

    else if (pedido.estado === "Completado") {
      claseEstado = "completado";
    }

    else if (pedido.estado === "Cancelado") {
      claseEstado = "cancelado";
    }


    let elemento =
      document.createElement("div");

    elemento.className = "pedido";


    elemento.innerHTML =

      "<h3>Pedido #" +
      (indice + 1) +
      "</h3>" +

      "<p><strong>Servicio:</strong> " +
      pedido.servicio +
      "</p>" +

      "<p><strong>Cliente:</strong> " +
      pedido.nombre +
      "</p>" +

      "<p><strong>Teléfono:</strong> " +
      pedido.telefono +
      "</p>" +

      "<p><strong>Recogida:</strong> " +
      pedido.recogida +
      "</p>" +

      "<p><strong>Entrega:</strong> " +
      pedido.entrega +
      "</p>" +

      "<p><strong>Precio:</strong> " +
      pedido.precio +
      "</p>" +

      "<p><strong>Detalles:</strong> " +
      pedido.detalles +
      "</p>" +

      "<span class='estado " +
      claseEstado +
      "'>" +
      pedido.estado +
      "</span>" +

      "<div class='botones'>" +

      "<button class='btn-pendiente' onclick='cambiarEstado(" +
      indice +
      ", \"Pendiente\")'>Pendiente</button>" +

      "<button class='btn-curso' onclick='cambiarEstado(" +
      indice +
      ", \"En curso\")'>En curso</button>" +

      "<button class='btn-completado' onclick='cambiarEstado(" +
      indice +
      ", \"Completado\")'>Completado</button>" +

      "<button class='btn-cancelado' onclick='cambiarEstado(" +
      indice +
      ", \"Cancelado\")'>Cancelado</button>" +

      "</div>";


    lista.appendChild(elemento);

  });


  actualizarEstadisticas();

}


function cambiarEstado(indice, estado) {

  pedidos[indice].estado = estado;

  mostrarPedidos();

}


function actualizarEstadisticas() {

  document.getElementById("total").innerText =
    pedidos.length;


  document.getElementById("pendientes").innerText =

    pedidos.filter(function(pedido) {

      return pedido.estado === "Pendiente";

    }).length;


  document.getElementById("curso").innerText =

    pedidos.filter(function(pedido) {

      return pedido.estado === "En curso";

    }).length;


  document.getElementById("completados").innerText =

    pedidos.filter(function(pedido) {

      return pedido.estado === "Completado";

    }).length;

}


function volverInicio() {

  window.location.href = "index.html";

}


mostrarPedidos();


</script>

</body>
</html>
